<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>antislop search</title>
<style>
  :root {
    --bg: #f6f4ef; --surface: #ffffff; --ink: #1d1c1a; --muted: #6b675f; --line: #e3dfd6;
    --accent: #b4532a; --accent-soft: #f6e3d8; --mark: #fbe7a1;
    --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --surface: #1e1d1b; --ink: #ece9e3; --muted: #9b968c; --line: #2f2d2a;
      --accent: #e48a5d; --accent-soft: #3a2a21; --mark: #5b4a12; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
  header h1 { font: 600 28px/1.1 ui-serif, Georgia, serif; margin: 0 0 4px; letter-spacing: -.01em; }
  header h1 span { color: var(--accent); }
  header p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

  form { display: flex; gap: 8px; }
  #q { flex: 1; min-width: 0; font: inherit; font-size: 18px; padding: 14px 16px; color: var(--ink);
       background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
       box-shadow: var(--shadow); outline: none; }
  #q:focus { border-color: var(--accent); }
  button { font: inherit; font-weight: 600; padding: 0 20px; border: 0; border-radius: var(--radius);
           background: var(--accent); color: #fff; cursor: pointer; }

  .knobs { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .knobs label { display: flex; align-items: center; gap: 6px; }
  .knobs select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
                  border-radius: 8px; padding: 4px 6px; }
  .status { min-height: 22px; font-size: 13px; color: var(--muted); margin: 6px 0 14px; }
  .status.err { color: #c0392b; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--surface); color: var(--muted); cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }

  .card { display: flex; gap: 16px; background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
  .card .body { min-width: 0; }
  .card h2 { font: 600 18px/1.3 ui-serif, Georgia, serif; margin: 0 0 2px; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { color: var(--accent); }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .meta a { color: var(--muted); }
  .snippet { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .snippet mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .summary { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-style: italic; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
         background: var(--accent-soft); color: var(--ink); margin-left: 6px; vertical-align: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  @media (max-width: 560px) { .card img { display: none; } #q { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>antislop <span>search</span></h1>
    <p id="sub">Search the essays, talks and videos you've collected.</p>
  </header>

  <form id="f">
    <input id="q" name="q" type="search" placeholder="what to do when you feel stuck…" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>

  <div class="knobs">
    <label>engine <select id="engine"></select></label>
    <label>mode <select id="retrieval"></select></label>
    <label>chunks <select id="chunker"></select></label>
    <label>model <select id="embedder"></select></label>
  </div>
  <div id="status" class="status"></div>
  <div id="filters" class="filters"></div>
  <div id="results"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const KNOBS = ["engine", "retrieval", "chunker", "embedder"];
let last = null, typeFilter = null;

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function highlight(text, terms) {
  let html = esc(text);
  if (!terms.length) return html;
  // Match on a 6-char prefix so "procrastinating" lights up "procrastination".
  const re = new RegExp("\\b(" + terms.map((t) => t.slice(0, 6).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\w*", "gi");
  return html.replace(re, (m) => `<mark>${m}</mark>`);
}

function fill(sel, values, value) {
  sel.innerHTML = values.map((v) => {
    const id = typeof v === "string" ? v : v.id;
    const label = typeof v === "string" ? v : v.id + (v.docker ? " (docker)" : "");
    return `<option value="${esc(id)}">${esc(label)}</option>`;
  }).join("");
  sel.value = value;
}

function syncEmbedder() { $("embedder").disabled = $("retrieval").value === "bm25"; }

async function init() {
  const o = await (await fetch("/api/options")).json();
  const p = new URLSearchParams(location.search);
  fill($("engine"), o.engines, p.get("engine") || o.defaults.engine);
  fill($("retrieval"), o.retrieval, p.get("retrieval") || o.defaults.retrieval);
  fill($("chunker"), o.chunkers, p.get("chunker") || o.defaults.chunker);
  fill($("embedder"), o.embedders, p.get("embedder") || o.defaults.embedder);
  $("sub").textContent = `Search ${o.n_docs} essays, talks and videos you've collected.`;
  syncEmbedder();
  if (p.get("q")) { $("q").value = p.get("q"); run(false); }
}

async function run(push = true) {
  const q = $("q").value.trim();
  if (!q) return;
  const params = new URLSearchParams({ q, ...Object.fromEntries(KNOBS.map((k) => [k, $(k).value])) });
  if (push) history.pushState(null, "", "?" + params);
  const slow = setTimeout(() => {
    $("status").textContent = $("engine").selectedOptions[0].text.includes("docker")
      ? "First search with this setup: starting the engine and building the index…"
      : "First search with this setup: building the index (embedding can take a minute)…";
  }, 400);
  $("status").className = "status"; $("status").textContent = "Searching…";
  try {
    const r = await fetch("/api/search?" + params);
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    last = data; typeFilter = null;
    const built = data.built_s ? ` · index built in ${data.built_s.toFixed(1)}s` : "";
    $("status").textContent = `${data.results.length} results · ${data.took_ms.toFixed(1)} ms · ${data.n_passages} passages${built}`;
    render();
  } catch (e) {
    $("status").className = "status err"; $("status").textContent = "Error: " + e.message;
    $("results").innerHTML = ""; $("filters").innerHTML = "";
  } finally { clearTimeout(slow); }
}

function render() {
  const res = last.results;
  const types = [...new Set(res.map((r) => r.type))];
  $("filters").innerHTML = types.length > 1 ? types.map((t) =>
    `<span class="chip ${t === typeFilter ? "on" : ""}" data-t="${esc(t)}">${esc(t)} · ${res.filter((r) => r.type === t).length}</span>`).join("") : "";
  const shown = typeFilter ? res.filter((r) => r.type === typeFilter) : res;
  $("results").innerHTML = shown.length ? shown.map((r) => `
    <article class="card">
      ${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      <div class="body">
        <h2><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${r.no_text ? '<span class="tag">metadata only</span>' : ""}</h2>
        <div class="meta">${esc(r.author)} · ${esc(r.type)} · ${esc(r.date)} · ${esc(r.read_time)} ·
          <a href="${esc(r.antislop_url)}" target="_blank" rel="noopener">antislop</a></div>
        <p class="snippet">${highlight(r.snippet, r.terms)}</p>
        ${r.snippet !== r.summary ? `<p class="summary">${esc(r.summary)}</p>` : ""}
      </div>
    </article>`).join("") : `<div class="empty">Nothing found.</div>`;
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); run(); });
$("retrieval").addEventListener("change", () => { syncEmbedder(); run(); });
["engine", "chunker", "embedder"].forEach((k) => $(k).addEventListener("change", () => run()));
$("filters").addEventListener("click", (e) => {
  const t = e.target.closest(".chip")?.dataset.t; if (!t) return;
  typeFilter = typeFilter === t ? null : t; render();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
window.addEventListener("popstate", () => { const p = new URLSearchParams(location.search);
  KNOBS.forEach((k) => p.get(k) && ($(k).value = p.get(k))); $("q").value = p.get("q") || ""; syncEmbedder(); if ($("q").value) run(false); });
init();
</script>
</body>
</html>
